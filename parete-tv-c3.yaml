# ConnectYourLife — Parete TV (variante ESP32-C3 Super Mini)
# Identico a parete-tv.yaml tranne board, GPIO dati e driver LED.
# ATTENZIONE: il C3 non ha alcun path DMA per LED addressable (I2S non
# supportato da NeoPixelBus su C3, use_dma solo su S3/P4). Si usa RMT con
# refill via ISR — vedi PROJECT.MD "Problema 2" per il contesto.

substitutions:
  device_name: parete-tv-c3
  friendly_name: "Parete TV C3"
  led_pin: GPIO5             # post level shifter 74AHCT125 (pad in alto a sx)
  num_leds: "70"             # 14 px/m × 5m
  # Reti di partenza per i campi del pannello: sono le stesse compilate nel
  # blocco wifi, cosi' i campi non nascono vuoti e "Applica WiFi" e' subito usabile.
  def_ssid1: !secret wifi_ssid
  def_pass1: !secret wifi_password
  def_ssid2: !secret wifi_ssid_backup
  def_pass2: !secret wifi_password_backup
  def_mqtt_broker: !secret mqtt_broker
  def_mqtt_user: !secret mqtt_username
  def_mqtt_pass: !secret mqtt_password

packages:
  base: !include common/base.yaml
  mqtt: !include common/mqtt.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Molto presto: si registra il riavvio prima che qualunque cosa possa
    # bloccarsi. Il contatore viene azzerato piu' avanti, se il device
    # dimostra di reggere (vedi l'interval "stabilita'").
    - priority: 700
      then:
        - lambda: 'id(boot_falliti) += 1;'

    - priority: -100
      then:
        - globals.set: {id: booted, value: 'true'}
        - lambda: |-
            // Se un campo e' vuoto (device gia' in uso prima che i default
            // esistessero) lo si riempie con la rete compilata.
            if (id(wifi1_ssid).state.empty()) id(wifi1_ssid).publish_state("${def_ssid1}");
            if (id(wifi1_pass).state.empty()) id(wifi1_pass).publish_state("${def_pass1}");
            if (id(wifi2_ssid).state.empty()) id(wifi2_ssid).publish_state("${def_ssid2}");
            if (id(wifi2_pass).state.empty()) id(wifi2_pass).publish_state("${def_pass2}");

        # MQTT si riaccende solo se l'utente lo voleva E il device non sta
        # rimbalzando: tre riavvii ravvicinati lo tengono spento, cosi' il
        # pannello resta raggiungibile invece di richiudersi nel ciclo.
        - if:
            condition:
              lambda: 'return id(mqtt_voluto) && id(boot_falliti) <= 3;'
            then:
              - lambda: |-
                  id(mqtt_client).set_broker_address(id(mqtt_broker_t).state);
                  id(mqtt_client).set_broker_port((uint16_t) id(mqtt_porta).state);
                  id(mqtt_client).set_username(id(mqtt_user_t).state);
                  id(mqtt_client).set_password(id(mqtt_pass_t).state);
              - mqtt.enable:
              - lambda: 'id(sw_mqtt).publish_state(true);'
            else:
              - if:
                  condition:
                    lambda: 'return id(mqtt_voluto);'
                  then:
                    - globals.set: {id: mqtt_sospeso, value: 'true'}
                    - logger.log: "MQTT sospeso dalla protezione: troppi riavvii ravvicinati"
                    - lambda: 'id(sw_mqtt).publish_state(false);'

esp32:
  board: nologo_esp32c3_super_mini
  framework:
    type: arduino


# --- Hotspot di emergenza ---
# Si unisce al blocco wifi di common/base.yaml (i package fondono le chiavi).
# Con l'hotspot attivo ci si collega alla rete "${device_name}-fallback" e il
# captive portal apre da solo la pagina per inserire le credenziali.
wifi:
  ap:
    ap_timeout: 45s     # senza connessione l'hotspot parte da solo

# --- Variabili globali ---
globals:
  - id: wipe_pos
    type: int
    restore_value: no
    initial_value: '0'
  - id: wipe_direction
    type: int
    restore_value: no
    initial_value: '1'          # 1 = accensione A→B, -1 = spegnimento B→A
  - id: skip_anim
    type: bool
    restore_value: no
    initial_value: 'false'      # bypassa on_turn_on durante riaccensione da wipe-off
  - id: wipe_off_running
    type: bool
    restore_value: no
    initial_value: 'false'      # vero mentre l'animazione di spegnimento è in corso
  - id: booted
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wipe_speed
    type: int
    restore_value: yes
    initial_value: '3'          # frame da 10 ms per ogni pixel del wipe
  - id: mqtt_voluto
    type: bool
    restore_value: yes
    initial_value: 'false'      # l'ultima scelta fatta dall'utente
  - id: boot_falliti
    type: int
    restore_value: yes
    initial_value: '0'          # riavvii ravvicinati consecutivi
  - id: mqtt_sospeso
    type: bool
    restore_value: no
    initial_value: 'false'      # MQTT tenuto spento dalla protezione
  - id: wifi_stato
    type: int
    restore_value: no
    initial_value: '0'          # 0 ok · 1 provo rete 1 · 2 provo rete 2 · 3 hotspot
  - id: anim_enabled
    type: bool
    restore_value: no           # lo ripristina lo switch "Animazione accensione"
    initial_value: 'true'

# --- Strip LED ---
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    pin: ${led_pin}
    num_leds: ${num_leds}
    # --- Timing a specifica datasheet WS2814F V1.1 (World-Semi, pag. 3) ---
    # NON si usa `chipset: SK6812`: quel preset ESPHome ha periodo 1200 ns
    # (300+900 / 600+600) mentre il WS2814F richiede TDATA >= 1,25 us, e non
    # emette alcun reset mentre il chip richiede RES >= 280 us per il latch.
    # Risoluzione RMT = 80 MHz -> 1 tick = 12,5 ns: tutti i valori sono interi esatti.
    bit0_high: 300ns           # T0H — spec 220~380 ns          (24 tick)
    bit0_low: 950ns            # T0L — spec 580 ns~1 us         (76 tick) => periodo 1250 ns
    bit1_high: 650ns           # T1H — spec 580 ns~1 us         (52 tick)
    bit1_low: 600ns            # T1L — spec 580 ns~1 us         (48 tick) => periodo 1250 ns
    reset_high: 0us
    reset_low: 300us           # RES — spec >= 280 us, 7% di margine (24000 tick)
    channel_colors: WRGB       # 32 bit, MSB first, ordine WRGB (datasheet pag. 4)
                               # sostituisce rgb_order+is_wrgb, deprecati dalla 2026.8
    rmt_symbols: 96            # massimo su C3 (2 blocchi da 48); no DMA su questa variante
    use_psram: false           # la Super Mini non ha PSRAM
    name: "${friendly_name}"
    # internal: false — esposto per color picker nativo web UI e HA
    default_transition_length: 0s   # workaround ESPHome bug #6621
    gamma_correct: 1.0
    color_correct: [100%, 100%, 100%, 100%]

    # Power ON → parte sempre il wipe A→B
    on_turn_on:
      - script.execute: lampeggio
      - if:
          condition:
            lambda: 'return !id(skip_anim) && id(anim_enabled);'
          then:
            - globals.set:
                id: wipe_pos
                value: '0'
            - globals.set:
                id: wipe_direction
                value: '1'
            - light.turn_on:
                id: led_strip
                brightness: 100%
                red: 0%
                green: 0%
                blue: 0%
                white: 100%
                effect: "Wipe White"

    # Power OFF → parte il wipe B→A (riaccende per animare, poi si spegne)
    on_turn_off:
      - script.execute: lampeggio
      - if:
          condition:
            lambda: 'return !id(wipe_off_running) && id(anim_enabled);'
          then:
            - globals.set:
                id: wipe_off_running
                value: 'true'
            - globals.set:
                id: wipe_direction
                value: '-1'
            - globals.set:
                id: skip_anim
                value: 'true'
            - light.turn_on:
                id: led_strip
                effect: "Wipe White"
            - globals.set:
                id: skip_anim
                value: 'false'
          else:
            # Chiamata interna da fine animazione → lascia spegnere
            - globals.set:
                id: wipe_off_running
                value: 'false'

    effects:
      # ---- Effetti integrati ----
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 50

      # ---- Effetti lambda custom ----
      - addressable_lambda:
          name: "Respiro Bianco"
          update_interval: 30ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.05f;
            if (ph > 6.2832f) ph -= 6.2832f;
            uint8_t w = (uint8_t)((sinf(ph) + 1.0f) * 127.5f);
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, 0, 0, w);
            }

      # ---- Preset colore fisso — scrittura diretta sul buffer, bypassa current_values ----
      - addressable_lambda:
          name: "Statico Bianco"
          update_interval: 30ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0, 255);

      - addressable_lambda:
          name: "Statico Rosso"
          update_interval: 30ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) it[i] = Color(255, 0, 0, 0);

      - addressable_lambda:
          name: "Statico Verde"
          update_interval: 30ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 255, 0, 0);

      - addressable_lambda:
          name: "Statico Blu"
          update_interval: 30ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 255, 0);

      # ---- Solido: legge il colore corrente da current_values (color picker live) ----
      - addressable_lambda:
          name: "Solido"
          update_interval: 30ms
          lambda: |-
            auto &s = id(led_strip).current_values;
            uint8_t r = (uint8_t)(s.get_red()   * 255);
            uint8_t g = (uint8_t)(s.get_green()  * 255);
            uint8_t b = (uint8_t)(s.get_blue()   * 255);
            uint8_t w = (uint8_t)(s.get_white()  * 255);
            for (int i = 0; i < it.size(); i++) it[i] = Color(r, g, b, w);

      - addressable_lambda:
          name: "Fade Colori"
          update_interval: 30ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.025f;
            if (ph > 6.2832f) ph -= 6.2832f;
            uint8_t r = (uint8_t)((sinf(ph)          + 1.0f) * 127.5f);
            uint8_t g = (uint8_t)((sinf(ph + 2.094f) + 1.0f) * 127.5f);
            uint8_t b = (uint8_t)((sinf(ph + 4.189f) + 1.0f) * 127.5f);
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(r, g, b, 0);
            }

      - addressable_lambda:
          name: "Tramonto"
          update_interval: 40ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.015f;
            if (ph > 6.2832f) ph -= 6.2832f;
            float t = (sinf(ph) + 1.0f) * 0.5f;
            uint8_t r = (uint8_t)(80 + t * 175);
            uint8_t g = (uint8_t)(t * 55);
            uint8_t w = (uint8_t)(t * 30);
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(r, g, 0, w);
            }

      - addressable_lambda:
          name: "Oceano"
          update_interval: 30ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.02f;
            if (ph > 6.2832f) ph -= 6.2832f;
            for (int i = 0; i < it.size(); i++) {
              float wave = sinf(ph + (float)i * 0.3f);
              uint8_t b = (uint8_t)((wave + 1.0f) * 100.0f + 55.0f);
              uint8_t g = (uint8_t)((wave + 1.0f) * 40.0f);
              it[i] = Color(0, g, b, 0);
            }

      - addressable_lambda:
          name: "TV Ambient Soft"
          update_interval: 50ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.02f;
            if (ph > 6.2832f) ph -= 6.2832f;
            uint8_t w = 180 + (uint8_t)((sinf(ph) + 1.0f) * 25.0f);
            for (int i = 0; i < it.size(); i++) it[i] = Color(20, 8, 0, w);

      - addressable_lambda:
          name: "Disco"
          update_interval: 80ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              uint8_t r = random_uint32() & 0xFF;
              uint8_t g = random_uint32() & 0xFF;
              uint8_t b = random_uint32() & 0xFF;
              it[i] = Color(r, g, b, 0);
            }

      - addressable_lambda:
          name: "Candela"
          update_interval: 80ms
          lambda: |-
            static float px[100];
            static float target = 160.0f;
            if (initial_run) {
              target = 160.0f;
              for (int i = 0; i < it.size(); i++) px[i] = 160.0f;
            }
            // Target globale oscilla lentamente — effetto soffio
            target += (float)((int)(random_uint32() % 61) - 30) * 0.4f;
            if (target > 210.0f) target = 210.0f;
            if (target < 90.0f)  target = 90.0f;
            // Ogni pixel segue il target con micro-variazione individuale
            for (int i = 0; i < it.size(); i++) {
              float noise = (float)((int)(random_uint32() % 41) - 20);
              px[i] = px[i] * 0.75f + (target + noise) * 0.25f;
              if (px[i] > 240.0f) px[i] = 240.0f;
              if (px[i] < 50.0f)  px[i] = 50.0f;
              uint8_t w = (uint8_t)px[i];
              uint8_t r = (uint8_t)(w * 0.13f);
              it[i] = Color(r, 3, 0, w);
            }

      - addressable_lambda:
          name: "Luce Notte"
          update_interval: 30000ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) it[i] = Color(1, 0, 0, 18);

      - addressable_lambda:
          name: "Scanner"
          update_interval: 25ms
          lambda: |-
            static int pos = 0; static int dir = 1;
            pos += dir;
            if (pos >= (int)it.size() - 1) dir = -1;
            if (pos <= 0) dir = 1;
            for (int i = 0; i < it.size(); i++) {
              int d = abs(i - pos);
              uint8_t v = d > 4 ? 0 : (uint8_t)(255 >> (d * 2));
              it[i] = Color(v, 0, 0, 0);
            }

      - addressable_lambda:
          name: "Stelle"
          update_interval: 60ms
          lambda: |-
            static float lum[100];
            if (initial_run) for (int i = 0; i < it.size(); i++) lum[i] = 0.0f;
            // ogni frame qualche pixel si accende, tutti gli altri sfumano
            for (int k = 0; k < 2; k++) {
              int i = random_uint32() % it.size();
              lum[i] = 1.0f;
            }
            for (int i = 0; i < it.size(); i++) {
              lum[i] *= 0.88f;
              uint8_t w = (uint8_t)(lum[i] * 255.0f);
              it[i] = Color(0, 0, 0, w);
            }

      - addressable_lambda:
          name: "Fuoco"
          update_interval: 50ms
          lambda: |-
            static float heat[100];
            if (initial_run) for (int i = 0; i < it.size(); i++) heat[i] = 0.0f;
            // raffredda, propaga verso l'alto, accende nuove braci alla base
            for (int i = 0; i < it.size(); i++)
              heat[i] -= (float)(random_uint32() % 20) / 255.0f * 1.2f;
            for (int i = it.size() - 1; i >= 2; i--)
              heat[i] = (heat[i-1] + heat[i-2] + heat[i-2]) / 3.0f;
            if ((random_uint32() % 100) < 55) {
              int i = random_uint32() % 5;
              heat[i] += (float)(random_uint32() % 96 + 160) / 255.0f;
            }
            for (int i = 0; i < it.size(); i++) {
              if (heat[i] < 0) heat[i] = 0;
              if (heat[i] > 1) heat[i] = 1;
              float h = heat[i];
              uint8_t r = (uint8_t)(h * 255);
              uint8_t g = (uint8_t)(h * h * 110);
              it[i] = Color(r, g, 0, 0);
            }

      - addressable_lambda:
          name: "Arcobaleno Lento"
          update_interval: 60ms
          lambda: |-
            static float ph = 0.0f;
            ph += 0.006f;
            if (ph > 1.0f) ph -= 1.0f;
            for (int i = 0; i < it.size(); i++) {
              float h = ph + (float)i / (float)it.size() * 0.35f;
              if (h > 1.0f) h -= 1.0f;
              float a = h * 6.2832f;
              uint8_t r = (uint8_t)((sinf(a)          + 1.0f) * 127.5f);
              uint8_t g = (uint8_t)((sinf(a + 2.094f) + 1.0f) * 127.5f);
              uint8_t b = (uint8_t)((sinf(a + 4.189f) + 1.0f) * 127.5f);
              it[i] = Color(r, g, b, 0);
            }

      - addressable_lambda:
          name: "Meteora"
          update_interval: 30ms
          lambda: |-
            static int pos = 0;
            static float trail[100];
            if (initial_run) { pos = 0; for (int i = 0; i < it.size(); i++) trail[i] = 0.0f; }
            for (int i = 0; i < it.size(); i++) trail[i] *= 0.80f;
            trail[pos] = 1.0f;
            pos = (pos + 1) % it.size();
            for (int i = 0; i < it.size(); i++) {
              uint8_t w = (uint8_t)(trail[i] * 255.0f);
              uint8_t b = (uint8_t)(trail[i] * 90.0f);
              it[i] = Color(0, 0, b, w);
            }

      - addressable_lambda:
          name: "Lampo"
          update_interval: 90ms
          lambda: |-
            // buio quasi sempre, con lampi improvvisi che riempiono la striscia
            static int flash = 0;
            if (flash > 0) {
              flash--;
              for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0, 255);
            } else {
              if ((random_uint32() % 100) < 6) flash = 1 + random_uint32() % 3;
              for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0, 8);
            }

      - addressable_lambda:
          name: "Onda Colore"
          update_interval: 40ms
          lambda: |-
            auto &s = id(led_strip).current_values;
            uint8_t cr = (uint8_t)(s.get_red()   * 255);
            uint8_t cg = (uint8_t)(s.get_green() * 255);
            uint8_t cb = (uint8_t)(s.get_blue()  * 255);
            static float ph = 0.0f;
            ph += 0.09f;
            if (ph > 6.2832f) ph -= 6.2832f;
            for (int i = 0; i < it.size(); i++) {
              float w = (sinf(ph + (float)i * 0.25f) + 1.0f) * 0.5f;
              it[i] = Color((uint8_t)(cr*w), (uint8_t)(cg*w), (uint8_t)(cb*w), 0);
            }

      - addressable_lambda:
          name: "Wipe White"
          update_interval: 10ms
          lambda: |-
            // La velocita' e' regolabile dal pannello: si scandisce a 10 ms e si
            // avanza solo ogni N frame, con N dato dallo slider "Velocita' wipe".
            static uint8_t tick = 0;
            uint8_t ogni = (uint8_t)id(wipe_speed);
            if (ogni < 1) ogni = 1;
            if (++tick < ogni && !initial_run) return;
            tick = 0;
            int pos = id(wipe_pos);
            int dir = id(wipe_direction);
            // wipe ON: bianco fisso; wipe OFF: colore corrente
            Color on_color;
            if (dir == 1) {
              on_color = Color(0, 0, 0, 255);
            } else {
              // legge dal buffer pixel — non da current_values che può mescolare RGB+W
              auto c = it[0].get();
              on_color = Color(c.r, c.g, c.b, c.w);
            }
            if (initial_run) {
              if (dir == -1 && pos == 0) {
                id(wipe_pos) = it.size();
                pos = it.size();
              }
              for (int i = 0; i < it.size(); i++) {
                it[i] = (i < pos) ? on_color : Color(0, 0, 0, 0);
              }
              if (dir == 1) return;
              // wipe OFF: inizia subito senza aspettare il prossimo frame
            }
            if (dir == 1) {
              if (pos < it.size()) {
                it[pos] = on_color;
                id(wipe_pos) = pos + 1;
              } else {
                id(wipe_pos) = it.size();  // reset esplicito prima della transizione
                auto call = id(led_strip).turn_on();
                call.set_effect("Statico Bianco");
                call.perform();
              }
            } else {
              if (pos > 0) {
                id(wipe_pos) = pos - 1;
                it[pos - 1] = Color(0, 0, 0, 0);
              } else {
                auto call = id(led_strip).turn_off();
                call.perform();
              }
            }

# --- Script toggle principale + timer spegnimento ---
script:
  - id: lampeggio
    # restart: piu' comandi ravvicinati producono un solo lampeggio visibile,
    # invece di una raffica.
    mode: restart
    then:
      - output.turn_on: led_bordo
      - delay: 120ms
      - output.turn_off: led_bordo

  - id: wifi_recovery
    mode: single
    then:
      - globals.set: {id: wifi_stato, value: '1'}
      - logger.log: "WiFi: nessuna connessione, 5 tentativi sulla rete 1"
      - repeat:
          count: 5
          then:
            - if:
                condition:
                  and:
                    - not:
                        wifi.connected:
                    - lambda: 'return !id(wifi1_ssid).state.empty();'
                then:
                  - wifi.configure:
                      ssid: !lambda 'return id(wifi1_ssid).state;'
                      password: !lambda 'return id(wifi1_pass).state;'
                      save: false          # in prova non si sovrascrive il salvato
                      timeout: 12s
                      on_connect:
                        - logger.log: "WiFi: connesso alla rete 1"
                        - globals.set: {id: wifi_stato, value: '0'}

      - globals.set: {id: wifi_stato, value: '2'}
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log: "WiFi: rete 1 fallita, 5 tentativi sulla rete 2"
            - repeat:
                count: 5
                then:
                  - if:
                      condition:
                        and:
                          - not:
                              wifi.connected:
                          - lambda: 'return !id(wifi2_ssid).state.empty();'
                      then:
                        - wifi.configure:
                            ssid: !lambda 'return id(wifi2_ssid).state;'
                            password: !lambda 'return id(wifi2_pass).state;'
                            save: false
                            timeout: 12s
                            on_connect:
                              - logger.log: "WiFi: connesso alla rete 2"
                              - globals.set: {id: wifi_stato, value: '0'}

      # Dieci tentativi a vuoto: si lascia il campo all'hotspot. Il ciclo di
      # connessione viene riavviato e, scaduto ap_timeout senza aggancio,
      # il fallback AP parte da solo con il captive portal.
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - globals.set: {id: wifi_stato, value: '3'}
            - logger.log: "WiFi: entrambe le reti fallite, attivo l'hotspot di emergenza"
            - wifi.disable:
            - delay: 3s
            - wifi.enable:
          else:
            - globals.set: {id: wifi_stato, value: '0'}

  - id: animated_toggle
    mode: restart
    then:
      - if:
          condition:
            light.is_on: led_strip
          then:
            # Avvia wipe OFF direttamente (senza passare per light.turn_off)
            - globals.set: {id: wipe_off_running, value: 'true'}
            - globals.set: {id: wipe_direction, value: '-1'}
            - globals.set: {id: skip_anim, value: 'true'}
            - light.turn_on:
                id: led_strip
                effect: "Wipe White"
            - globals.set: {id: skip_anim, value: 'false'}
          else:
            - light.turn_on:
                id: led_strip
                brightness: 100%

  - id: sleep_timer
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(sleep_minutes).state * 60000.0f);'
      - if:
          condition:
            light.is_on: led_strip
          then:
            - script.execute: animated_toggle
      - lambda: 'id(sleep_minutes).publish_state(0.0f);'


# --- Sorveglianza connessione ---
interval:
  - interval: 200ms
    then:
      - lambda: |-
          static std::string precedente = "";
          std::string ora = id(led_strip).get_effect_name();
          if (ora != precedente) {
            bool interno = (ora == "Wipe White" || precedente == "Wipe White");
            bool primo = precedente.empty();
            precedente = ora;
            if (!interno && !primo) id(lampeggio).execute();
          }
  # Novanta secondi in piedi bastano a dire che il riavvio non era sintomo di
  # un ciclo: il contatore torna a zero e la protezione si riarma.
  - interval: 90s
    then:
      - if:
          condition:
            lambda: 'return id(boot_falliti) != 0 && id(booted);'
          then:
            - globals.set: {id: boot_falliti, value: '0'}
            - logger.log: "Avvio considerato stabile: contatore riavvii azzerato"
  - interval: 60s
    then:
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              - not:
                  wifi.ap_active:
              - lambda: 'return id(booted);'
          then:
            - script.execute: wifi_recovery

# --- Stato animazione ---
binary_sensor:
  - platform: template
    name: "Animazione in corso"
    lambda: 'return id(wipe_off_running);'


text_sensor:
  - platform: template
    name: "Stato MQTT"
    icon: "mdi:shield-sync"
    entity_category: diagnostic
    lambda: |-
      if (id(mqtt_sospeso)) return {"Sospeso dopo riavvii"};
      if (id(mqtt_client).is_connected()) return {"Connesso"};
      if (id(mqtt_voluto)) return {"Connessione in corso"};
      return {"Disattivato"};
    update_interval: 10s

  - platform: template
    name: "Stato WiFi"
    icon: "mdi:wifi-cog"
    entity_category: diagnostic
    lambda: |-
      switch (id(wifi_stato)) {
        case 1:  return {"Tentativi rete 1"};
        case 2:  return {"Tentativi rete 2"};
        case 3:  return {"Hotspot di emergenza"};
        default: return {"Connesso"};
      }
    update_interval: 10s

  - platform: wifi_info
    ssid:
      name: "Rete connessa"
      icon: "mdi:wifi-check"
      entity_category: diagnostic
    ip_address:
      name: "Indirizzo IP"
      icon: "mdi:ip-network"
      entity_category: diagnostic

# --- Sensori diagnostici ---
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# --- Slider luminosità + timer spegnimento ---
number:
  - platform: template
    name: "MQTT porta"
    id: mqtt_porta
    icon: "mdi:numeric"
    entity_category: config
    min_value: 1
    max_value: 65535
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1883

  - platform: template
    name: "Velocita wipe"
    id: num_wipe_speed
    icon: "mdi:speedometer"
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 3
    on_value:
      - globals.set:
          id: wipe_speed
          value: !lambda 'return (int)x;'

  - platform: template
    id: sleep_minutes
    name: "Spegnimento automatico"
    min_value: 0
    max_value: 120
    step: 5
    unit_of_measurement: "min"
    mode: slider
    optimistic: true
    initial_value: 0
    on_value:
      - if:
          condition:
            lambda: 'return x > 0 && id(booted);'
          then:
            - script.execute: sleep_timer
          else:
            - script.stop: sleep_timer

  - platform: template
    name: "Luminosità"
    min_value: 1
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 100
    on_value:
      - if:
          condition:
            lambda: 'return id(booted);'
          then:
            - globals.set: {id: skip_anim, value: 'true'}
            - light.turn_on:
                id: led_strip
                brightness: !lambda 'return x / 100.0f;'
            - globals.set: {id: skip_anim, value: 'false'}

# --- Pulsanti ---
button:
  - platform: restart
    name: "Restart"


  - platform: template
    name: "Applica MQTT"
    icon: "mdi:content-save-cog"
    entity_category: config
    on_press:
      - script.execute: lampeggio
      - lambda: |-
          id(mqtt_client).set_broker_address(id(mqtt_broker_t).state);
          id(mqtt_client).set_broker_port((uint16_t) id(mqtt_porta).state);
          id(mqtt_client).set_username(id(mqtt_user_t).state);
          id(mqtt_client).set_password(id(mqtt_pass_t).state);
      - logger.log: "MQTT: parametri aggiornati, riconnessione"
      - mqtt.disable:
      - delay: 1s
      - if:
          condition:
            switch.is_on: sw_mqtt
          then:
            - mqtt.enable:

  - platform: template
    name: "Applica WiFi"
    icon: "mdi:wifi-sync"
    entity_category: config
    on_press:
      - script.execute: lampeggio
      # wifi.configure imposta UNA rete per volta: la seconda si prova solo
      # se la prima non aggancia entro il timeout (on_error).
      - if:
          condition:
            lambda: 'return !id(wifi1_ssid).state.empty();'
          then:
            - logger.log:
                format: "WiFi: provo la rete 1 (%s)"
                args: ['id(wifi1_ssid).state.c_str()']
            - wifi.configure:
                ssid: !lambda 'return id(wifi1_ssid).state;'
                password: !lambda 'return id(wifi1_pass).state;'
                save: true
                timeout: 25s
                on_error:
                  - logger.log: "WiFi: rete 1 fallita, provo la rete 2"
                  - if:
                      condition:
                        lambda: 'return !id(wifi2_ssid).state.empty();'
                      then:
                        - wifi.configure:
                            ssid: !lambda 'return id(wifi2_ssid).state;'
                            password: !lambda 'return id(wifi2_pass).state;'
                            save: true
                            timeout: 25s
                            on_error:
                              - logger.log: "WiFi: fallite entrambe le reti"
          else:
            - logger.log: "WiFi: campo rete 1 vuoto, niente da applicare"


  - platform: template
    name: "Toggle Luce"
    on_press:
      - script.execute: animated_toggle

  - platform: template
    name: "Bianco"
    on_press:
      - globals.set: {id: skip_anim, value: 'true'}
      - globals.set: {id: wipe_off_running, value: 'false'}
      - light.turn_on:
          id: led_strip
          effect: "Statico Bianco"
      - globals.set: {id: skip_anim, value: 'false'}

  - platform: template
    name: "Rosso"
    on_press:
      - globals.set: {id: skip_anim, value: 'true'}
      - globals.set: {id: wipe_off_running, value: 'false'}
      - light.turn_on:
          id: led_strip
          effect: "Statico Rosso"
      - globals.set: {id: skip_anim, value: 'false'}

  - platform: template
    name: "Verde"
    on_press:
      - globals.set: {id: skip_anim, value: 'true'}
      - globals.set: {id: wipe_off_running, value: 'false'}
      - light.turn_on:
          id: led_strip
          effect: "Statico Verde"
      - globals.set: {id: skip_anim, value: 'false'}

  - platform: template
    name: "Blu"
    on_press:
      - globals.set: {id: skip_anim, value: 'true'}
      - globals.set: {id: wipe_off_running, value: 'false'}
      - light.turn_on:
          id: led_strip
          effect: "Statico Blu"
      - globals.set: {id: skip_anim, value: 'false'}

  - platform: template
    name: "Notte"
    on_press:
      - globals.set: {id: skip_anim, value: 'true'}
      - globals.set: {id: wipe_off_running, value: 'false'}
      - light.turn_on:
          id: led_strip
          effect: "Luce Notte"
      - globals.set: {id: skip_anim, value: 'false'}

# ── LED di bordo: riscontro visivo dei comandi ──
# Sulla Super Mini il LED blu sta su GPIO8 ed e' attivo basso, da cui inverted.
# GPIO8 e' anche pin di strapping, ma il livello conta solo all'avvio: usarlo
# come uscita a boot concluso non interferisce.
output:
  - platform: gpio
    id: led_bordo
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true

# ── Tipo di strip installata ──
# Il canale W e' fisico e non cambia: quello che cambia e' la tonalita' del
# bianco che la strip emette. La scelta serve al pannello per rappresentare
# il colore reale nell'anteprima e nel wipe, invece di mostrare sempre lo
# stesso bianco a prescindere dal prodotto montato.
select:
  - platform: template
    name: "Tipo strip"
    id: tipo_strip
    icon: "mdi:led-strip-variant"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "RGBW calda 3000K"
      - "RGBW naturale 4000K"
      - "RGBW fredda 6500K"
    initial_option: "RGBW calda 3000K"

# ── Interruttori di configurazione (gestibili dal pannello) ──
switch:
  - platform: template
    name: "MQTT"
    id: sw_mqtt
    icon: "mdi:transit-connection-variant"
    entity_category: config
    optimistic: true
    # DISABLED e non ALWAYS_OFF: in template_switch.cpp il setup di ALWAYS_OFF
    # chiama turn_off(), che esegue la turn_off_action -> azzerava mqtt_voluto
    # a ogni avvio, cancellando la scelta dell'utente. Con DISABLED lo switch
    # non agisce al boot: a decidere e' l'on_boot, che incrocia mqtt_voluto
    # con il numero di riavvii ravvicinati.
    restore_mode: DISABLED
    turn_on_action:
      - globals.set: {id: mqtt_voluto, value: 'true'}
      - globals.set: {id: mqtt_sospeso, value: 'false'}
      - globals.set: {id: boot_falliti, value: '0'}   # riaccensione manuale = nuova fiducia
      # I parametri del pannello vanno scritti nel client PRIMA di connettersi:
      # quelli compilati servono solo come valore di partenza dei campi.
      - lambda: |-
          id(mqtt_client).set_broker_address(id(mqtt_broker_t).state);
          id(mqtt_client).set_broker_port((uint16_t) id(mqtt_porta).state);
          id(mqtt_client).set_username(id(mqtt_user_t).state);
          id(mqtt_client).set_password(id(mqtt_pass_t).state);
      - mqtt.enable:
    turn_off_action:
      - globals.set: {id: mqtt_voluto, value: 'false'}
      - globals.set: {id: mqtt_sospeso, value: 'false'}
      - mqtt.disable:

  - platform: template
    name: "Animazione accensione"
    id: sw_anim
    icon: "mdi:motion-play"
    entity_category: config
    optimistic: true
    # Lo switch e' la fonte di verita': il suo stato viene ripristinato al boot e
    # riallinea il global. Con una lambda di stato + optimistic i due si
    # contendevano il valore e al primo avvio vinceva la memoria non inizializzata.
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set: {id: anim_enabled, value: 'true'}
    turn_off_action:
      - globals.set: {id: anim_enabled, value: 'false'}

# ── Nome mostrato nel pannello (l'hostname resta quello di compilazione) ──
