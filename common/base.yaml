# Configurazione base condivisa — WiFi, API, OTA, web_server v3
# Inclusa dai file dispositivo via: packages: base: !include common/base.yaml

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 2
    - ssid: !secret wifi_ssid_backup
      password: !secret wifi_password_backup
      priority: 1
  fast_connect: true
  ap:
    ssid: "${device_name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Senza questo il device si riavvia se nessun client API si connette per 15
  # minuti (default reboot_timeout: 15min) — e al riavvio la luce torna spenta.
  # Va a 0 perche' questi device devono funzionare anche standalone, comandati
  # dal solo pannello web, senza Home Assistant collegato.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  # Accesso protetto: il browser chiede le credenziali alla prima apertura e le
  # riusa per tutta la sessione, comprese le chiamate REST e lo stream eventi.
  # Si usa "basic" e non "digest" perche' e' quello che tutti i client gestiscono
  # senza sorprese (EventSource incluso); su rete locale e' la scelta pratica.
  auth:
    username: !secret web_username
    password: !secret web_password
    type: basic
  version: 3
  local: false
  include_internal: false
  css_include: "custom/connectyourlife.css"
  js_include: "custom/connectyourlife.js"

mdns:
  disabled: false

time:
  - platform: sntp
    id: sntp_time
